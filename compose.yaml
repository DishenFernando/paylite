
name: paylite

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    networks:
      - private

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DAILY_TRANSFER_LIMIT: ${DAILY_TRANSFER_LIMIT:-10000}
      SEED_DEMO: ${SEED_DEMO:-true}
      TZ: UTC

    # Laptop + mobile access
    ports:
      - "0.0.0.0:${APP_PORT:-8001}:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - private

  adminer:
    image: adminer:latest
    restart: unless-stopped

    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: nette

    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - private

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile

    profiles:
      - test

    restart: "no"

    environment:
      TEST_BASE_URL: http://app:8000

    volumes:
      - ./tests:/opt/tests:ro

    working_dir: /opt

    command:
      - python
      - -m
      - pytest
      - -q
      - /opt/tests

    depends_on:
      app:
        condition: service_healthy

    networks:
      - private

volumes:
  postgres_data:

networks:
  private:
    driver: bridge
